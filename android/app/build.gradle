plugins {
    id "com.android.application"
}

// The release signing key never lives in the repo. CI (or a local build) passes it in through these
// environment variables; without them only the debug build can be made.
def releaseKeystore = System.getenv("READLI_KEYSTORE_PATH")

android {
    namespace "ai.readli.app"
    compileSdk 36

    defaultConfig {
        applicationId "ai.readli.app"
        minSdk 23
        targetSdk 36
        versionCode Integer.parseInt(System.getenv("READLI_VERSION_CODE") ?: "1")
        versionName "1.0." + (System.getenv("READLI_VERSION_CODE") ?: "1")
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("READLI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("READLI_KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("READLI_KEY_PASSWORD") ?: System.getenv("READLI_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
