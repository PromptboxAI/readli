name: Email outbox

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: email-outbox
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the email endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.READLI_SITE_URL || 'https://readli.ai' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/email"
