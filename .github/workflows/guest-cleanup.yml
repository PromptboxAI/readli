name: Guest cleanup

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: guest-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the guest cleanup endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.READLI_SITE_URL || 'https://readli.ai' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set"
            exit 1
          fi
          body=$(curl --fail-with-body --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/guest-cleanup")
          echo "$body"
          if [ "$(echo "$body" | jq '.failed // 0')" != "0" ]; then
            echo "::error::Some expired guest sessions could not be deleted"
            exit 1
          fi
