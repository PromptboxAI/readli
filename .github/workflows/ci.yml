name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    # Playwright 1.56 cannot install its browser on ubuntu-latest (now 26.04), so stay on 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Find the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      # The browser itself comes from Playwright's CDN, not apt, so an Ubuntu mirror outage can't block it.
      - name: Install the Playwright browser
        run: npx playwright install chromium
      # The runner image already has Chromium's system libraries. This only tops up extras such as fonts,
      # so a broken apt mirror logs a warning instead of failing the build.
      - name: Install extra browser system packages (best effort)
        continue-on-error: true
        timeout-minutes: 5
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore
