name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    # Playwright 1.56 cannot install its browser on ubuntu-latest (now 26.04), so stay on 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore
