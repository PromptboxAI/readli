name: Android app

# Builds the Readli Android app (android/). Every run makes a test APK to install on a phone. On main
# (or when run by hand) it is also published as a pre-release, so it can be downloaded straight to a
# phone. When the signing secrets are set, it also makes the signed bundle to upload to Google Play.
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      READLI_VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Keep one debug key between runs, so a newer test build installs over the old one.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: readli-android-debug-keystore

      - name: Build the test app
        run: ./gradlew --no-daemon assembleDebug

      - name: Build the signed Play Store bundle
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          READLI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          READLI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          READLI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          READLI_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore" ./gradlew --no-daemon bundleRelease

      - name: Name the files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/readli-test-${READLI_VERSION_CODE}.apk"
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "out/readli-play-${READLI_VERSION_CODE}.aab"
          fi

      - name: Show the test key's fingerprint
        run: |
          fp=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p')
          {
            echo "### Readli Android build ${READLI_VERSION_CODE}"
            echo
            echo "Test key SHA-256 (add to ANDROID_CERT_FINGERPRINTS on Vercel to hide the address bar in test builds):"
            echo
            echo "\`$fp\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: readli-android-${{ github.run_number }}
          path: android/out/

      - name: Publish the test app for phones
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-test-${READLI_VERSION_CODE}" "out/readli-test-${READLI_VERSION_CODE}.apk" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Readli Android test build ${READLI_VERSION_CODE}" \
            --notes "Test build for phones. Open this page on the Android phone, tap the .apk file, and allow the install."
